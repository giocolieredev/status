name: Monitor services

on:
  schedule:
    # Every 10 minutes
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run health checks
        run: python monitor.py

      - name: Commit and push updated status
        run: |
          git config user.name "crii.me status bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-update status ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
          else
            echo "No status changes to commit"
          fi

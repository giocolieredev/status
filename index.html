<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Status — crii.me</title>
  <meta name="description" content="System status for crii.me — website, blog, and CDN uptime.">
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23FF6B00'/><text x='4' y='24' font-family='monospace' font-size='20' font-weight='900' fill='white'>C</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --orange: #FF6B00;
      --orange-d: #CC5500;
      --orange-l: #FF8C33;
      --black: #0A0A0A;
      --gray-900: #111111;
      --gray-800: #1A1A1A;
      --gray-700: #2A2A2A;
      --gray-600: #3A3A3A;
      --gray-500: #6A6A6A;
      --gray-400: #9A9A9A;
      --gray-300: #C0C0C0;
      --white: #FAFAFA;
      --green: #22c55e;
      --green-dim: rgba(34,197,94,0.15);
      --yellow: #eab308;
      --yellow-dim: rgba(234,179,8,0.15);
      --red: #ef4444;
      --red-dim: rgba(239,68,68,0.15);
      --blue: #3b82f6;
      --blue-dim: rgba(59,130,246,0.15);
      --font-head: 'Space Grotesk', sans-serif;
      --font-mono: 'Space Mono', monospace;
      --speed: 0.15s;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-head);
      background: var(--black);
      color: var(--white);
      min-height: 100vh;
      line-height: 1.6;
    }

    .scanlines {
      pointer-events: none;
      position: fixed;
      inset: 0;
      z-index: 9990;
      background: repeating-linear-gradient(0deg, transparent, transparent 2px,
        rgba(255,255,255,0.008) 2px, rgba(255,255,255,0.008) 4px);
    }

    /* ── Status Banner ── */
    .status-banner {
      padding: 32px;
      text-align: center;
      border-bottom: 3px solid var(--gray-700);
      transition: background 0.3s, border-color 0.3s;
    }
    .status-banner.operational { background: var(--green-dim); border-color: var(--green); }
    .status-banner.degraded { background: var(--yellow-dim); border-color: var(--yellow); }
    .status-banner.outage { background: var(--red-dim); border-color: var(--red); }
    .status-banner.maintenance { background: var(--blue-dim); border-color: var(--blue); }

    .status-icon {
      font-size: 3rem;
      margin-bottom: 12px;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    .status-title {
      font-family: var(--font-mono);
      font-size: clamp(1.5rem, 4vw, 2.2rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }

    .status-subtitle {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--gray-400);
    }

    .status-subtitle .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 6px;
      animation: blink 1.4s ease-in-out infinite;
    }
    .dot.green { background: var(--green); }
    .dot.yellow { background: var(--yellow); }
    .dot.red { background: var(--red); }
    .dot.blue { background: var(--blue); }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* ── Container ── */
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 32px;
    }

    /* ── Section Headers ── */
    .section-header {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--gray-400);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .section-header::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--gray-700);
    }

    /* ── Service Cards ── */
    .services { margin-bottom: 48px; }

    .service-card {
      background: var(--gray-800);
      border: 1px solid var(--gray-700);
      padding: 20px 24px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      transition: border-color var(--speed);
    }
    .service-card:hover { border-color: var(--gray-600); }

    .service-info { flex: 1; }

    .service-name {
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 0.95rem;
      margin-bottom: 4px;
    }

    .service-desc {
      font-size: 0.8rem;
      color: var(--gray-500);
    }

    .service-status {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 6px 14px;
      white-space: nowrap;
    }
    .service-status.operational { background: var(--green-dim); color: var(--green); }
    .service-status.degraded { background: var(--yellow-dim); color: var(--yellow); }
    .service-status.outage { background: var(--red-dim); color: var(--red); }
    .service-status.maintenance { background: var(--blue-dim); color: var(--blue); }

    /* ── Uptime Bars ── */
    .uptime-section { margin-bottom: 48px; }

    .uptime-card {
      background: var(--gray-800);
      border: 1px solid var(--gray-700);
      padding: 20px 24px;
      margin-bottom: 8px;
    }

    .uptime-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .uptime-name {
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 0.85rem;
    }

    .uptime-percent {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      font-weight: 700;
    }
    .uptime-percent.good { color: var(--green); }
    .uptime-percent.warn { color: var(--yellow); }
    .uptime-percent.bad { color: var(--red); }

    .uptime-bar {
      display: flex;
      gap: 2px;
      height: 28px;
    }

    .uptime-segment {
      flex: 1;
      border-radius: 2px;
      transition: opacity var(--speed);
      cursor: pointer;
      position: relative;
    }
    .uptime-segment.up { background: var(--green); }
    .uptime-segment.down { background: var(--red); }
    .uptime-segment.degraded { background: var(--yellow); }
    .uptime-segment.maintenance { background: var(--blue); }
    .uptime-segment:hover { opacity: 0.7; }

    .uptime-segment .tooltip {
      display: none;
      position: absolute;
      bottom: 100%;
      left: 50%;
      transform: translateX(-50%);
      background: var(--black);
      border: 1px solid var(--gray-600);
      padding: 6px 10px;
      font-family: var(--font-mono);
      font-size: 0.7rem;
      white-space: nowrap;
      z-index: 100;
      margin-bottom: 4px;
      color: var(--white);
    }
    .uptime-segment:hover .tooltip { display: block; }

    .uptime-legend {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      font-family: var(--font-mono);
      font-size: 0.65rem;
      color: var(--gray-500);
    }

    /* ── Incidents ── */
    .incidents { margin-bottom: 48px; }

    .incident-card {
      background: var(--gray-800);
      border: 1px solid var(--gray-700);
      border-left: 4px solid var(--gray-600);
      padding: 20px 24px;
      margin-bottom: 12px;
    }
    .incident-card.resolved { border-left-color: var(--green); }
    .incident-card.investigating { border-left-color: var(--yellow); }
    .incident-card.identified { border-left-color: var(--orange); }
    .incident-card.monitoring { border-left-color: var(--blue); }
    .incident-card.postmortem { border-left-color: var(--gray-400); }

    .incident-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .incident-title {
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 0.95rem;
    }

    .incident-badge {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 4px 10px;
    }
    .incident-badge.resolved { background: var(--green-dim); color: var(--green); }
    .incident-badge.investigating { background: var(--yellow-dim); color: var(--yellow); }
    .incident-badge.identified { background: rgba(255,107,0,0.15); color: var(--orange); }
    .incident-badge.monitoring { background: var(--blue-dim); color: var(--blue); }
    .incident-badge.postmortem { background: rgba(154,154,154,0.15); color: var(--gray-400); }

    .incident-meta {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--gray-500);
      margin-bottom: 16px;
    }

    .incident-services {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .incident-service-tag {
      font-family: var(--font-mono);
      font-size: 0.6rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 2px 8px;
      background: var(--gray-700);
      color: var(--gray-400);
    }

    .incident-updates { border-top: 1px solid var(--gray-700); padding-top: 12px; }

    .incident-update {
      display: flex;
      gap: 16px;
      padding: 8px 0;
      font-size: 0.85rem;
    }

    .update-time {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--gray-500);
      white-space: nowrap;
      min-width: 80px;
    }

    .update-status {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 2px 8px;
      white-space: nowrap;
    }
    .update-status.investigating { background: var(--yellow-dim); color: var(--yellow); }
    .update-status.identified { background: rgba(255,107,0,0.15); color: var(--orange); }
    .update-status.monitoring { background: var(--blue-dim); color: var(--blue); }
    .update-status.resolved { background: var(--green-dim); color: var(--green); }

    .update-message { color: var(--gray-300); flex: 1; }

    .no-incidents {
      text-align: center;
      padding: 40px;
      color: var(--gray-500);
      font-family: var(--font-mono);
      font-size: 0.85rem;
    }
    .no-incidents .icon { font-size: 2rem; margin-bottom: 8px; }

    /* ── Footer ── */
    .footer {
      border-top: 2px solid var(--gray-700);
      padding: 24px 32px;
      text-align: center;
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--gray-500);
    }
    .footer a { color: var(--orange); text-decoration: none; }
    .footer a:hover { text-decoration: underline; }

    .refresh-note {
      margin-top: 8px;
      font-size: 0.65rem;
      color: var(--gray-600);
    }

    /* ── Loading ── */
    .loading {
      text-align: center;
      padding: 80px 24px;
      font-family: var(--font-mono);
      color: var(--gray-400);
    }
    .spinner {
      display: inline-block;
      width: 40px;
      height: 40px;
      border: 3px solid var(--gray-600);
      border-top-color: var(--orange);
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Responsive ── */
    @media (max-width: 640px) {
      .container { padding: 16px; }
      .status-banner { padding: 24px 16px; }
      .service-card { padding: 16px; flex-direction: column; align-items: flex-start; }
      .uptime-card { padding: 16px; }
      .incident-card { padding: 16px; }
      .incident-header { flex-direction: column; }
      .incident-update { flex-direction: column; gap: 4px; }
      .update-time { min-width: auto; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <div class="scanlines" aria-hidden="true"></div>

  <div class="status-banner" id="status-banner">
    <div class="status-icon" id="status-icon">✓</div>
    <div class="status-title" id="status-title">Loading…</div>
    <div class="status-subtitle" id="status-subtitle">
      <span class="dot green"></span> Checking systems…
    </div>
  </div>

  <div class="container">
    <div id="content">
      <div class="loading">
        <div class="spinner"></div>
        <div>Loading status…</div>
      </div>
    </div>
  </div>

  <footer class="footer">
    <a href="https://crii.me">crii.me</a> ·
    <a href="https://blog.crii.me">blog</a> ·
    <a href="https://cdn.crii.me">cdn</a> ·
    <a href="https://link.crii.me">links</a> ·
    <a href="https://bio.crii.me">bio</a> ·
    <a href="https://help.crii.me">help</a> ·
    <a href="https://github.com/giocolieredev/status">source</a>
    <div class="refresh-note">Monitored automatically every 10 min · Page refreshes every 5 min</div>
  </footer>

  <script>
    /* ══════════════════════════════════════════
       CONFIG
    ══════════════════════════════════════════ */
    const STATUS_JSON_URL = 'https://raw.githubusercontent.com/giocolieredev/status/main/status.json';
    const REFRESH_INTERVAL = 300000; // 5 minutes

    const STATUS_META = {
      operational: { icon: '✓', label: 'All Systems Operational', color: 'green' },
      degraded: { icon: '⚠', label: 'Degraded Performance', color: 'yellow' },
      outage: { icon: '✕', label: 'Major Outage', color: 'red' },
      maintenance: { icon: '🔧', label: 'Under Maintenance', color: 'blue' }
    };

    const SEVERITY_META = {
      none: { label: 'Info', color: 'green' },
      minor: { label: 'Minor', color: 'yellow' },
      major: { label: 'Major', color: 'orange' },
      critical: { label: 'Critical', color: 'red' },
      maintenance: { label: 'Maintenance', color: 'blue' }
    };

    /* ══════════════════════════════════════════
       HELPERS
    ══════════════════════════════════════════ */
    function formatDate(dateStr) {
      if (!dateStr) return '—';
      const d = new Date(dateStr);
      return d.toLocaleDateString('en-US', {
        month: 'short', day: 'numeric', year: 'numeric',
        hour: '2-digit', minute: '2-digit'
      });
    }

    function formatTime(dateStr) {
      if (!dateStr) return '';
      const d = new Date(dateStr);
      return d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
    }

    function timeAgo(dateStr) {
      if (!dateStr) return '';
      const diff = Date.now() - new Date(dateStr).getTime();
      if (diff < 60000) return 'just now';
      if (diff < 3600000) return Math.floor(diff / 60000) + 'm ago';
      if (diff < 86400000) return Math.floor(diff / 3600000) + 'h ago';
      return Math.floor(diff / 86400000) + 'd ago';
    }

    function calculateUptime(hours) {
      if (!hours || hours.length === 0) return 100;
      const up = hours.filter(h => h === 1).length;
      return ((up / hours.length) * 100).toFixed(1);
    }

    /* ══════════════════════════════════════════
       RENDER
    ══════════════════════════════════════════ */
    function renderBanner(data) {
      const meta = STATUS_META[data.status] || STATUS_META.operational;
      const banner = document.getElementById('status-banner');
      const icon = document.getElementById('status-icon');
      const title = document.getElementById('status-title');
      const subtitle = document.getElementById('status-subtitle');

      banner.className = 'status-banner ' + data.status;
      icon.textContent = meta.icon;
      title.textContent = meta.label;
      subtitle.innerHTML = `<span class="dot ${meta.color}"></span> Last updated: ${timeAgo(data.lastUpdated)}`;
    }

    function renderServices(services) {
      let html = `
        <div class="services">
          <div class="section-header">Services</div>`;

      services.forEach(s => {
        const meta = STATUS_META[s.status] || STATUS_META.operational;
        html += `
          <div class="service-card">
            <div class="service-info">
              <div class="service-name">${s.name}</div>
              <div class="service-desc">${s.description || ''}</div>
            </div>
            <div class="service-status ${s.status}">${meta.label}</div>
          </div>`;
      });

      html += '</div>';
      return html;
    }

    function renderUptime(services, uptime) {
      let html = `
        <div class="uptime-section">
          <div class="section-header">Uptime — Last 24 Hours</div>`;

      services.forEach(s => {
        const hours = uptime[s.slug] || [];
        const percent = calculateUptime(hours);
        const percentClass = percent >= 99.9 ? 'good' : percent >= 99 ? 'warn' : 'bad';

        html += `
          <div class="uptime-card">
            <div class="uptime-header">
              <div class="uptime-name">${s.name}</div>
              <div class="uptime-percent ${percentClass}">${percent}%</div>
            </div>
            <div class="uptime-bar">`;

        hours.forEach((h, i) => {
          const hourAgo = 24 - i;
          const cls = h === 1 ? 'up' : h === 0 ? 'down' : h === 0.5 ? 'degraded' : 'maintenance';
          html += `
            <div class="uptime-segment ${cls}">
              <div class="tooltip">${hourAgo}h ago: ${cls === 'up' ? 'Operational' : cls === 'down' ? 'Down' : cls === 'degraded' ? 'Degraded' : 'Maintenance'}</div>
            </div>`;
        });

        html += `
            </div>
            <div class="uptime-legend">
              <span>24 hours ago</span>
              <span>Now</span>
            </div>
          </div>`;
      });

      html += '</div>';
      return html;
    }

    function renderIncidents(incidents) {
      let html = `
        <div class="incidents">
          <div class="section-header">Incident History</div>`;

      if (!incidents || incidents.length === 0) {
        html += `
          <div class="no-incidents">
            <div class="icon">✓</div>
            <div>No incidents reported</div>
          </div>`;
      } else {
        incidents.forEach(inc => {
          const latestUpdate = inc.updates?.[inc.updates.length - 1];
          const latestStatus = latestUpdate?.status || inc.status;

          html += `
            <div class="incident-card ${latestStatus}">
              <div class="incident-header">
                <div class="incident-title">${inc.title}</div>
                <div class="incident-badge ${latestStatus}">${latestStatus}</div>
              </div>
              <div class="incident-meta">
                ${formatDate(inc.created)}${inc.resolved ? ' — resolved ' + timeAgo(inc.resolved) : ''}
              </div>`;

          if (inc.services && inc.services.length > 0) {
            html += '<div class="incident-services">';
            inc.services.forEach(s => {
              html += `<span class="incident-service-tag">${s}</span>`;
            });
            html += '</div>';
          }

          if (inc.updates && inc.updates.length > 0) {
            html += '<div class="incident-updates">';
            inc.updates.forEach(u => {
              html += `
                <div class="incident-update">
                  <div class="update-time">${formatTime(u.time)}</div>
                  <div class="update-status ${u.status}">${u.status}</div>
                  <div class="update-message">${u.message}</div>
                </div>`;
            });
            html += '</div>';
          }

          html += '</div>';
        });
      }

      html += '</div>';
      return html;
    }

    /* ══════════════════════════════════════════
       MAIN
    ══════════════════════════════════════════ */
    async function loadStatus() {
      try {
        const res = await fetch(STATUS_JSON_URL + '?t=' + Date.now());
        if (!res.ok) throw new Error('Failed to load status');
        const data = await res.json();

        renderBanner(data);

        let content = '';
        content += renderServices(data.services || []);
        content += renderUptime(data.services || [], data.uptime || {});
        content += renderIncidents(data.incidents || []);

        document.getElementById('content').innerHTML = content;
      } catch (err) {
        document.getElementById('content').innerHTML = `
          <div class="loading" style="color:var(--red)">
            <div>⚠️ Failed to load status</div>
            <div style="margin-top:8px;font-size:0.8rem;color:var(--gray-400)">${err.message}</div>
            <button onclick="loadStatus()" style="margin-top:16px;background:var(--orange);color:var(--black);border:none;padding:8px 16px;font-family:var(--font-mono);font-weight:700;cursor:pointer">Retry</button>
          </div>`;
      }
    }

    // Init
    loadStatus();
    setInterval(loadStatus, REFRESH_INTERVAL);
  </script>
</body>

</html>
